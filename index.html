<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CCNAクエスト</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="s-title" class="screen"></section>

  <section id="s-map" class="screen" hidden>
    <header class="hud">
      <div class="hud-area"><span id="hud-area">-</span><small id="hud-prog"></small></div>
      <button id="btn-menu" class="hud-btn" aria-label="メニュー">☰ メニュー</button>
    </header>
    <div class="map-wrap"><canvas id="map" width="144" height="176"></canvas></div>
    <div class="pad">
      <div class="dpad">
        <button data-dir="up" class="d-up" aria-label="上">▲</button>
        <button data-dir="left" class="d-left" aria-label="左">◀</button>
        <button data-dir="right" class="d-right" aria-label="右">▶</button>
        <button data-dir="down" class="d-down" aria-label="下">▼</button>
      </div>
      <button id="btn-a" class="a-btn">話す</button>
    </div>
  </section>

  <section id="s-battle" class="screen" hidden></section>
  <section id="s-panel" class="screen" hidden></section>

  <div id="dialog" hidden>
    <div class="dlg-box">
      <div class="dlg-name" id="dlg-name"></div>
      <div class="dlg-text" id="dlg-text"></div>
      <div class="dlg-next">▼ タップでつぎへ</div>
    </div>
  </div>
  <div id="flash"></div>
  <div id="toast"></div>
</div>

<script src="js/core.js"></script>
<script src="packs/ccna/a1.js"></script>
<script src="packs/ccna/a2.js"></script>
<script src="packs/ccna/a3.js"></script>
<script src="packs/ccna/a4.js"></script>
<script src="packs/ccna/a5.js"></script>
<script src="packs/ccna/a6.js"></script>
<script src="packs/ccna/a7.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/gen.js"></script>
<script src="js/maps.js"></script>
<script src="js/ui.js"></script>
<script src="js/quiz.js"></script>
<script src="js/battle.js"></script>
<script src="js/world.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
